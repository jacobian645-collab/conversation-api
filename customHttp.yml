# Response headers for the chat UI on AWS Amplify Hosting. The page's own Content-Security-Policy (script
# hash, and calls only to the API) is a <meta> tag written by scripts/build_ui.py; frame-ancestors only
# works as a header, so it is set here.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'Content-Security-Policy'
        value: "frame-ancestors 'none'"
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'Cache-Control'
        value: 'no-cache'
